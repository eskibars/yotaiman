[project]
name = "yotaiman"
version = "0.1.0"
description = "A local SDK and Flask service that keeps a Yoto card fresh."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["yoto", "yotoplay", "audio", "kids", "flask"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "requests>=2.31",
    "flask>=3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
books = ["mobi>=0.3", "pypdf>=4.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/eskibars/yotaiman"
Issues = "https://github.com/eskibars/yotaiman/issues"

[project.scripts]
yotaiman = "yoto_daily.__main__:main"
yoto-auth = "yoto.auth_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "yoto",
    "yoto_daily",
    "yoto_daily.capabilities",
    "yoto_daily.content",
    "yoto_daily.generators",
]

[tool.setuptools.package-data]
yoto_daily = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::urllib3.exceptions.NotOpenSSLWarning",
]
