# yotaiman configuration.
#
# This file chooses which music and speech generators the service runs.
# Environment variables override anything set here, so secrets never have to
# live in this file.

service:
  host: 127.0.0.1
  port: 8787
  debug: false
  # How often the service refreshes the access token in the background, in
  # seconds. The token lasts eight hours; an hour keeps it fresh. Zero
  # turns the refresher off.
  token_refresh_interval: 3600
  # Where a caller-supplied file path may point. A path that resolves
  # outside every one of these is refused, so the service cannot be used to
  # read a file it should not reach. Use the platform separator to list
  # more than one: "~/yotaiman:~/Audiobooks".
  content_dirs:
    - ~/yotaiman

daily:
  # The card the daily job rewrites. This is the card paired with the
  # player, so it is named here rather than created: a card nobody has
  # paired is a card nobody will ever hear.
  card_id: "1LHgD"
  # replace = one story per day; history = keep the last N days as chapters
  mode: replace
  history_days: 7
  # The voice the daily capabilities narrate in. It names one of the voices
  # under generators.speech.options.<name>.voices.
  voice: dad

theme:
  # Who the card is written for. The writer uses this to pitch the words.
  audience: "two children, one about five years old and one about ten"
  # auto = use the local model if it is there, fall back to the hand-written
  # themes if it is not. Also: ollama, template.
  backend: auto
  # The local Ollama server that writes the story and the song. The facts
  # are written from the source, not by the model.
  ollama_endpoint: http://127.0.0.1:11434
  ollama_model: llama3.2:3b
  ollama_timeout: 900
  # How many times to ask the model before giving up and using the
  # hand-written theme instead. A story that repeats itself or reads as a
  # list is thrown away and written again.
  attempts: 3
  # How long the theme song should be, in seconds. A song in the content
  # library says how long it wants to be; this is the length used for a
  # song that does not.
  song_seconds: 120
  # How many planets to pull facts about for a themed card.
  research_facts: 8

generators:
  # ---------------------------------------------------------------
  # Music
  # ---------------------------------------------------------------
  music:
    default: ace-step-local

    options:
      # A local ACE-Step 1.5 API server.
      #   python -m acestep.api_server --host 127.0.0.1 --port 8001
      # Docs: https://ace-step.github.io/ACE-Step-1.5/en/INFERENCE
      ace-step-local:
        type: ace-step
        enabled: true
        endpoint: http://127.0.0.1:8001
        # Set ACESTEP_API_KEY in the environment if the server requires one.
        # api_key_env: ACESTEP_API_KEY
        model: acestep-v15-turbo
        timeout: 900
        poll_interval: 5
        # Defaults for every request; a request may override any of them.
        # Whether the song has a voice is decided by the request itself, so
        # there is no instrumental default here.
        defaults:
          audio_format: mp3
          audio_duration: 60
          inference_steps: 16
          thinking: true

      # A procedural placeholder. No model, no GPU -- useful for testing
      # the track pipeline end to end.
      synth:
        type: synth
        enabled: true
        base_frequency: 220

  # ---------------------------------------------------------------
  # Speech
  # ---------------------------------------------------------------
  speech:
    default: ming-tts

    options:
      # macOS say. No credentials, no server.
      say:
        type: say
        enabled: true
        voice: Karen

      # Ming-3.0-tts, narrating in a cloned voice. Set this as the default
      # above and the daily story and read-aloud capabilities use it too.
      #
      # The inference code comes from the GitHub checkout (code_path) and
      # the weights from the Hub (repo_id); point model_path at a local
      # copy and nothing is downloaded. Needs torch in the environment
      # that runs the service:
      #   pip install --index-url https://download.pytorch.org/whl/cpu \
      #       torch==2.6.0 torchaudio==2.6.0
      #   pip install transformers==4.46.3 accelerate==1.3.0 x_transformers==2.9.2 \
      #       diffusers==0.33.0 onnxruntime soundfile==0.12.1 inflect einops \
      #       loguru tqdm huggingface_hub
      ming-tts:
        type: ming-tts
        enabled: true
        code_path: ../Ming-3.0-tts
        repo_id: inclusionAI/Ming-3.0-tts-0.5b
        # Leave empty to pull the checkpoint into cache_dir on first use.
        model_path: ../Ming-3.0-tts/models/Ming-3.0-tts-0.5b
        cache_dir: ~/.cache/yotaiman/models
        auto_download: true
        device: auto
        language_id: English
        # The clip to clone, and the exact words spoken in it.
        # The file has to exist here -- the generator reports it as
        # unavailable until it does.
        # reference_wav: ~/yotaiman/my_voice.wav
        # reference_text: 
        # Optional delivery instruction. Set one and the model narrates in
        # that style, still in the cloned voice.
        instruction: "Read slowly and deliberately, the way a parent reads a children's storybook out loud. Warm, clear and patient, with a little wonder, and a smile in the voice."
        use_spk_emb: true
        # Needs pynini, which has no Windows wheel. Leave it off there.
        text_normalization: false
        # The model reads faster than a person reads a story aloud. The
        # audio is time-stretched afterwards to bring it down to a
        # storybook pace; the pitch is kept, so the voice still sounds
        # like a voice. 1.0 is the model's own pace.
        speech_rate: 0.62
        # The model has no grammar to normalise numbers with, so they are
        # written out before it sees them.
        spell_numbers: true
        # The voice used when a request does not name one.
        voice: dad
        # Named voices, picked with the "voice" parameter.
        #
        # The clip has to be short. Ming-3.0-tts shares one 512-position
        # budget between the reference clip, its transcript and the words it
        # speaks, so a long clip leaves almost nothing to say. Between three
        # and eight seconds is the useful range -- cut a longer recording
        # with:
        #
        #   yotaiman prepare-voice --wav recording.wav \
        #       --out-wav voice/reference.wav --out-text voice/reference.txt \
        #       --transcript recording.txt
        voices:
          dad:
            reference_wav: voice/shane-reference.wav
            reference_text: "Hi, my name is Shane, and this recording is the raw material for a small voice model I want to train on my own speech."
            instruction: "Read slowly and deliberately, the way a parent reads a children's storybook out loud. Warm, clear and patient, with a little wonder, and a smile in the voice."

      # A local TTS model server. The contract is:
      #   POST <url>  {"text": "...", "voice": "..."}  ->  audio bytes
      # Kokoro, MLX-Audio and similar can be wrapped in a few lines.
      local-model:
        type: http
        enabled: false
        url: http://127.0.0.1:8880/tts
        voice: default
        timeout: 300

      # A hosted service. api_key_env keeps the key out of this file.
      hosted:
        type: http
        enabled: false
        url: https://api.elevenlabs.io/v1/text-to-speech/{voice}
        api_key_env: ELEVENLABS_API_KEY
        voice: rachel
        timeout: 120
